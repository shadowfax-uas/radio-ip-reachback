#!/usr/sbin/nft -f

flush ruleset

# 1. Open Routing and Filtering
table inet filter {
	chain input {
		type filter hook input priority filter; policy accept;
	}

	chain forward {
		type filter hook forward priority filter; policy accept;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# 2. IPv4 NAT & Masquerade Rules (Placed right alongside the filter)
table ip nat {
    chain posterouting {
	type nat hook postrouting priority srcnat; policy accept;
	# Masquerade traffic leaving the Silvus Radio interface (eth0)
	oifname "eth0" masquerade;
    }
}
